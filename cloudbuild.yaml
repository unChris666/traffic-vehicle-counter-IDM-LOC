steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '${_IMAGE}', 'python', '-m', 'pip', 'check']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', '${_IMAGE}', 'python', '-m', 'traffic_location.integration.container_runtime', '--verify']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: asia-southeast1-docker.pkg.dev/locdeproject/location-intelligence/engine:manual
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
