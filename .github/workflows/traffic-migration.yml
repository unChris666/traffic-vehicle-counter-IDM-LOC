name: Traffic migration contracts and parity gates
on:
  push:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/traffic-migration.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/traffic-migration.yml']
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install '.[validation,migration]'
      - run: python -m unittest discover -s tests -v
      - run: python -m mypy --strict --follow-imports=silent src/traffic_location/traffic/contracts src/traffic_location/traffic/config
      - run: python -m build
      - name: Import installed wheel outside the repository
        run: |
          python -m venv /tmp/traffic-rc
          /tmp/traffic-rc/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/traffic-rc/bin/traffic-location --help
          /tmp/traffic-rc/bin/python -c "from traffic_location.traffic.application.pipeline import process_video; from traffic_location.traffic.application.batch import run_batch"
