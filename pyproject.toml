[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-location-engines"
version = "0.2.0rc1"
description = "Explicit frozen-input Traffic and Location research engine adapters"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema==4.26.0"]
migration = ["mypy==1.18.2", "build==1.3.0"]

[project.scripts]
traffic-location = "traffic_location.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_location = ["schemas/*.json", "location/*.json"]
